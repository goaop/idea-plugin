# Qodana configuration:
# https://www.jetbrains.com/help/qodana/qodana-yaml.html

version: 1.0
linter: jetbrains/qodana-jvm-community:latest
projectJDK: "17"
profile:
  name: qodana.recommended
exclude:
  - name: All
    paths:
      - .qodana
      # Generated by GrammarKit and JFlex from pointcut.bnf and PointcutLexer.flex: regenerated, never edited
      - src/main/java/com/aopphp/go/parser/PointcutLexer.java
      - src/main/java/com/aopphp/go/parser/PointcutParser.java
      - src/main/java/com/aopphp/go/psi
